name: Build and Release Windows EXE

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile
          --name AirSlideVoiceControl
          --collect-all vosk
          --collect-all sounddevice
          --collect-all cffi
          --hidden-import vosk
          --hidden-import sounddevice
          voice_control.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AirSlideVoiceControl.exe")) {
            throw "PyInstaller output was not found."
          }
          Get-Item "dist/AirSlideVoiceControl.exe" | Select-Object Name, Length

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSlideVoiceControl-Windows
          path: dist/AirSlideVoiceControl.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AirSlide Voice Control v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: dist/AirSlideVoiceControl.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
